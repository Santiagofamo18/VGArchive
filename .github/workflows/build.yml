name: Build VGArchive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-24.04
            target: linux
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenjp2-tools libfuse2
      - run: pnpm install --frozen-lockfile
      - if: matrix.target == 'windows'
        run: pnpm build:windows
      - if: matrix.target == 'linux'
        run: pnpm build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: vgarchive-${{ matrix.target }}
          path: dist-apps/*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: vgarchive-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
